name: PR quality

# Anti-slop gate (os/standard/pr-quality.md). REUSABLE ONLY (workflow_call): a product repo calls it from a `pull_request_target` workflow or
# carries a copy whose `on:` is `pull_request_target` with types [opened, synchronize, reopened, edited, ready_for_review], plus
# .github/pr-quality/{pr-body-check.mjs,slop-guard.mjs}, .pr-quality.json and .pr-quality-baseline.json (ci/pr-quality/README.md).
# THE GUARDS RUN FROM THE BASE BRANCH. The workflow comes from the base, the scripts and config are checked out from the base tip, and the
# PR is only scanned as data (checked out into pr/, never executed). A PR cannot edit a guard, a baseline or the config to pass: the ratchet
# is enforced against the BASE's baseline and eslint suppressions. Both jobs are plain node: no install, seconds to run.
# FORK PRs are checked like any other (a skipped check would be a free pass): the fork's head is checked out into pr/ and only scanned.
on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-body:
    name: PR body sections
    runs-on: ${{ fromJSON(vars.EBDA_LIGHT_RUNS_ON || vars.EBDA_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    # fork-guard-exempt: forks must be checked too (a skipped check is a pass); only the base branch's scripts run, the PR body is data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check Verified / Not verified / Cost-if-wrong, fix and review-finding rules (warn-only until bodyCheckEnforceFrom)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
          PR_QUALITY_CONFIG: .pr-quality.json
        run: |
          set -euo pipefail
          CHANGED_FILES="$(gh pr diff "$PR" --name-only)"
          export CHANGED_FILES
          node .github/pr-quality/pr-body-check.mjs

  slop-baselines:
    name: Slop baselines
    runs-on: ${{ fromJSON(vars.EBDA_LIGHT_RUNS_ON || vars.EBDA_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    # fork-guard-exempt: forks must be checked too (a skipped check is a pass); the PR is only scanned as data, symlinks are never followed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: no-any, no-console, todo-no-issue, emoji-copy, duplicate-helper, unused-export (baseline may only shrink, judged against the base)
        run: node base/.github/pr-quality/slop-guard.mjs --root pr --base-root base

      - name: Remove the checkouts (a self-hosted runner keeps its workspace between jobs; never leave a fork's files on it)
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/pr" "$GITHUB_WORKSPACE/base"

  capability-ratchet:
    name: Capability baselines
    runs-on: ${{ fromJSON(vars.EBDA_LIGHT_RUNS_ON || vars.EBDA_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    # fork-guard-exempt: forks must be checked too (a skipped check is a pass); the PR is only read as data, symlinks are refused
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Capability baselines may only shrink (judged against the base branch)
        run: |
          if [ -f base/.github/pr-quality/capability-ratchet.mjs ]; then
            node base/.github/pr-quality/capability-ratchet.mjs --base base --pr pr
          else
            # the adoption PR: the script reaches the base branch only when this PR merges; every later PR is judged by it
            echo "::notice::capability-ratchet.mjs is not on the base branch yet (adoption PR): nothing to compare"
          fi

      - name: Remove the checkouts (a self-hosted runner keeps its workspace between jobs; never leave a fork's files on it)
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/pr" "$GITHUB_WORKSPACE/base"
