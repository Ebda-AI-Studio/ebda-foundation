name: Prod watch
# Ruling AIOS-7 (2026-11-11): the PRIMARY probe loop runs on the brain's Cron Trigger; this GitHub-hosted run is the secondary
# heartbeat from outside Cloudflare (R2 log rules, daily digest, probe alerts while the brain does not answer).

# The outside-in production watch for the Ebda suite (os/ops/ebda-prod-watch.mjs). It was designed to run on GitHub-hosted runners ON PURPOSE (no longer possible, Ruling NO-HOSTED-RUNNERS-1; the workflow is disabled): off
# Cloudflare (so a Cloudflare-wide outage, which also takes down status.ebda.app and the brain Worker, still alerts) and off the
# Egyptian ISP that blocks Cloudflare's 188.114.96/97.x range from the Mac. It must never follow EBDA_RUNS_ON onto the self-hosted Mac runners.
#
# Every 10 min: probe every public host, read the last Logpush window from R2 (ebda-logs), alert P1s to Telegram (deduped, <= 6/day,
# an all-hosts-down outage always gets through), queue the rest for ONE daily digest (first run after 05:00 UTC).
# workflow_dispatch: mode=drill sends one test alert end to end and records the Telegram message id; mode=digest sends the digest now.
#
# Secrets (repo or org): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, EBDA_LOGS_CF_TOKEN (Account > Workers R2 Storage > Read),
# CLOUDFLARE_ACCOUNT_ID; optional EBDA_GH_READ_TOKEN (contents:read on ebda-store + ebda-whatsapp), EBDA_OS_INGEST_TOKEN.
# A missing required secret turns the run RED (never silently green); GitHub's failed-run mail is the fallback channel.
# Footprint: ~1 min per run, 144 runs/day ~ 4,300 Actions min/month of the org's 50,000; R2 reads ~40 API calls per run.
on:
  # Ruling CI-MIN-2 (Ahmad 2026-11-16, "do not use GitHub again, I don't have money to pay"): the 10-minute schedule is OFF.
  # This hosted job billed ~250-300 Actions minutes/day. The brain's Cron Trigger stays the primary probe loop (Ruling AIOS-7).
  # Manual drills/digests only. Cost: no outside-Cloudflare heartbeat during a Cloudflare-wide outage.
  workflow_dispatch:
    inputs:
      mode:
        description: watch | digest | drill
        required: true
        default: drill
        type: choice
        options: [watch, digest, drill]

permissions:
  contents: read

concurrency:
  group: prod-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Probe + logs + alert
    # NO-HOSTED-RUNNERS-1: this workflow is DISABLED (gh workflow disable); it was hosted-only by design (outside-in, off the Egyptian ISP that
    # blocks Cloudflare's range from the Mac) and cannot keep that property on a Mac runner. The brain's Cron Trigger is the primary probe loop.
    runs-on: ${{ fromJSON(vars.EBDA_RUNS_ON || '["ebda-mac-light"]') }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            os/ops/ebda-prod-watch.mjs
            os/ops/lib/ebda-logs-core.mjs
            os/ops/lib/ebda-logs-r2.mjs
            os/config/prod-watch.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Restore dedupe state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .prod-watch-state.json
          key: prod-watch-state-${{ github.run_id }}
          restore-keys: prod-watch-state-
      - name: Watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBDA_LOGS_CF_TOKEN: ${{ secrets.EBDA_LOGS_CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EBDA_GH_READ_TOKEN: ${{ secrets.EBDA_GH_READ_TOKEN }}
          EBDA_OS_INGEST_TOKEN: ${{ secrets.EBDA_OS_INGEST_TOKEN }}
          EBDA_OS_BRAIN_URL: https://os.ebda.app
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'watch' }}
        run: node os/ops/ebda-prod-watch.mjs --mode "$MODE" --state .prod-watch-state.json
      - name: Save dedupe state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .prod-watch-state.json
          key: prod-watch-state-${{ github.run_id }}
