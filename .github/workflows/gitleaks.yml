name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly FULL-history scan (a PR scan only sees its own commits).
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  # A push to main gets a group of its OWN (keyed by sha) so a burst of merges never collapses
  # into one. `cancel-in-progress: false` alone was not enough (issue 2454): GitHub keeps at most
  # ONE pending run per group, so a second merge cancelled the earlier main run while it was still
  # pending, before it ever scanned, and the required "Scan for leaked secrets" gate went
  # `cancelled` on main commits. PR pushes keep the per-ref group, where cancelling the superseded
  # run is correct (a newer sha supersedes it).
  group: gitleaks-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Scan for leaked secrets
    # short-job: median 12 s over recent main runs (RUNNER-ANY-1): any free runner, never queued behind a heavy job
    runs-on: ${{ fromJSON(vars.EBDA_ANY_RUNS_ON || vars.EBDA_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -eu
          GITLEAKS_VERSION=8.21.2
          # The runner's OS + arch (linux x64 on hosted ubuntu, darwin arm64 on the ebda-mac runner), checksum-pinned from the
          # v8.21.2 release's checksums.txt, installed into this job's RUNNER_TEMP (no sudo, nothing left on a shared host).
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) P=linux_x64; SHA=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba ;;
            Linux-aarch64|Linux-arm64) P=linux_arm64; SHA=654c935542c89f565aabe7bf7c6c500830f116c114f0aeb509d2460c1ac2e6da ;;
            Darwin-arm64) P=darwin_arm64; SHA=cad3de5dc9a4d5447d967a70a4d49499c557f04db028274cc324f9ff983f6502 ;;
            Darwin-x86_64) P=darwin_x64; SHA=5b42c6e4b1fd693eaeb2b5b7faa5f17a1434299d4deb2de63d4b2efd7c753128 ;;
            *) echo "::error::no gitleaks build for $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          TARBALL="gitleaks_${GITLEAKS_VERSION}_${P}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$TARBALL" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${SHA}  $RUNNER_TEMP/$TARBALL" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xz -C "$RUNNER_TEMP/bin" -f "$RUNNER_TEMP/$TARBALL" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Run gitleaks
        # A pull request is scanned over ITS OWN commit range only (base..head). `gitleaks detect` otherwise walks
        # `git log --all`, and with fetch-depth 0 that includes every other open PR's branch, so one branch's test
        # fixture failed this gate on every unrelated PR (#228, 2026-10-25). Pushes to main, the nightly schedule
        # and manual dispatch keep the full-history scan. The pre-commit hook uses the same .gitleaks.toml.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "gitleaks: scanning the PR range ${BASE_SHA}..${HEAD_SHA}"
            gitleaks detect --source . --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact --verbose --exit-code 1
          else
            echo "gitleaks: scanning the full history"
            gitleaks detect --source . --redact --verbose --exit-code 1
          fi
