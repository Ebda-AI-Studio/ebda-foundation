<!doctype html>
<!-- Whisky 11 post image, 1080x1080. Palette from the Whisky 11 brand kit (BRAND.md): ground #0B0E11, panel #12161A, fg #F2F5F7,
     muted #9AA6AF, red-lift #B4243B (bars on dark), cyan #4DD8E6 (call to action). Fonts: Barlow Condensed / Barlow (SIL OFL). -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap">
<style>
  html,body{margin:0;width:1080px;height:1080px;background:#0B0E11;color:#F2F5F7}
  .f{box-sizing:border-box;width:1080px;height:1080px;padding:96px;display:flex;flex-direction:column;justify-content:space-between;
     background:radial-gradient(900px 700px at 85% 10%,#12161A 0,#0B0E11 70%)}
  .bars{display:flex;gap:14px}.bars i{display:block;width:18px;height:72px;background:#B4243B}
  h1{font:700 92px/1.02 'Barlow Condensed',sans-serif;letter-spacing:-.5px;margin:0;max-width:880px;text-wrap:balance}
  p{font:400 36px/1.4 Barlow,sans-serif;color:#9AA6AF;margin:28px 0 0;max-width:860px}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font:500 30px Barlow,sans-serif;color:#9AA6AF}
  .foot b{font:700 44px 'Barlow Condensed',sans-serif;color:#F2F5F7;letter-spacing:1px}.cta{color:#4DD8E6}
</style></head><body><div class="f">
  <div class="bars"><i></i><i></i></div>
  <div><h1>{{headline}}</h1><p>{{sub}}</p></div>
  <div class="foot"><b>WHISKY 11</b><span class="cta">whisky11.com</span></div>
</div></body></html>
