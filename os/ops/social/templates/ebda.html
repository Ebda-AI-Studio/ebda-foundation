<!doctype html>
<!-- Ebda AI Studio post image, 1080x1080. Brand: night grounds + Ebda gold #B08D57, metallic brass/silver; NO orange. Arabic first.
     Font: IBM Plex Sans Arabic (SIL OFL), the same family the OS dashboard ships. -->
<html lang="{{lang}}" dir="{{dir}}"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
  html,body{margin:0;width:1080px;height:1080px;background:#0A0D14;color:#F3EFE6}
  .f{box-sizing:border-box;width:1080px;height:1080px;padding:96px;display:flex;flex-direction:column;justify-content:space-between;
     background:radial-gradient(800px 640px at 15% 0%,#1A1F2B 0,#0A0D14 72%);font-family:'IBM Plex Sans Arabic',sans-serif}
  .rule{width:160px;height:6px;background:linear-gradient(90deg,#8A6A3B,#B08D57,#D9C39A,#B08D57);border-radius:3px}
  h1{font-weight:700;font-size:84px;line-height:1.25;margin:0;max-width:888px;text-wrap:balance}
  p{font-weight:400;font-size:36px;line-height:1.6;color:#C9C3B6;margin:28px 0 0;max-width:870px}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:30px;color:#C9C3B6}
  .foot b{font-weight:600;font-size:38px;color:#D9C39A;letter-spacing:.5px}
</style></head><body><div class="f">
  <div class="rule"></div>
  <div><h1>{{headline}}</h1><p>{{sub}}</p></div>
  <div class="foot"><b>Ebda AI Studio</b><span>ebda.app</span></div>
</div></body></html>
